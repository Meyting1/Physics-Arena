<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=1529,H=688,wall=24,goalW=170,goalDepth=78;
// Keep the complete supplied arena image, including the player-name and score panels.
const FIELD={left:330,right:1240,top:113,bottom:677,goalTop:272,goalBottom:490};
let dpr=1,scale=1,offsetX=0,offsetY=0,scoreA=0,scoreB=0,turn='A',aim=null,selected=null,shots=0,particles=[],trails=[],soundOn=true,audio=null,toastTimer=0,settleTimer=0;
const bodies=[];
// Four fixed circular goal posts. Their collision response uses the same circle-circle solver as player discs.
const goalPostRadius=10.9;
const goalPosts=[
 {x:FIELD.left,y:FIELD.goalTop,r:goalPostRadius,inv:0,vx:0,vy:0,spin:0,kind:'post'},
 {x:FIELD.left,y:FIELD.goalBottom,r:goalPostRadius,inv:0,vx:0,vy:0,spin:0,kind:'post'},
 {x:FIELD.right,y:FIELD.goalTop,r:goalPostRadius,inv:0,vx:0,vy:0,spin:0,kind:'post'},
 {x:FIELD.right,y:FIELD.goalBottom,r:goalPostRadius,inv:0,vx:0,vy:0,spin:0,kind:'post'}
];
let screenState='teamSelect',chosenTeam=-1,opponentTeam=-1;
const teamChoices=[
 {name:'ESTEGHLAL',file:'teams/esteghlal-new.png',image:new Image()},
 {name:'PERSEPOLIS',file:'teams/Perspolis-new.png',image:new Image()},
 {name:'SEPAHAN',file:'teams/sepahan-new.png',image:new Image()},
 {name:'TRACTOR',file:'teams/teraktor-new.png',image:new Image()}
];
teamChoices.forEach(t=>{t.image.src=t.file});

const pieceSide=new Image(),pieceTop=new Image();
pieceSide.src='piece-logo-new.png';
pieceTop.src='piece-top-new.png';
const ballTexture=new Image();ballTexture.src='ball_exact.jpg';
// Keep the original high-resolution arena artwork for maximum visual fidelity.
const fieldTexture=new Image();fieldTexture.src='1794090316714.jpg';
// Decorative goal-net overlays; crop transparent padding so the complete goal artwork is visible.
function goalAlphaBounds(img){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
 const px=g.getImageData(0,0,c.width,c.height).data;
 let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
  if(px[(y*c.width+x)*4+3]>8){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
 }
 return maxX>=minX?{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}:{x:0,y:0,w:c.width,h:c.height};
}
function drawGoalOverlay(img,bounds,x,y,w,h){
 if(!img.complete||!img.naturalWidth)return;
 const b=bounds||{x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
 ctx.drawImage(img,b.x,b.y,b.w,b.h,x,y,w,h);
}
const goalLeftTexture=new Image(),goalRightTexture=new Image();
let goalLeftBounds=null,goalRightBounds=null;
goalLeftTexture.onload=()=>{goalLeftBounds=goalAlphaBounds(goalLeftTexture)};
goalRightTexture.onload=()=>{goalRightBounds=goalAlphaBounds(goalRightTexture)};
goalLeftTexture.src='goal-left.png';goalRightTexture.src='goal-right.png';

const make=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,inv:1/mass,spin:0,angle:0,frictionActive:false});
function setup(){
 bodies.length=0;
 bodies.push(make(W*.24,H/2,47.15172,5,'#53f5e8','strikerA'));
 bodies.push(make(W*.76,H/2,47.15172,5,'#ff4f9a','strikerB'));
 bodies.push(make((FIELD.left+FIELD.right)/2,(FIELD.top+FIELD.bottom)/2,13.2,.82,'#f5fbff','ball'));
 for(let i=0;i<4;i++){const y=H/2+(i-1.5)*76;bodies.push(make(W*.38,y,47.15172,5,'#1fb9c9','discA'));bodies.push(make(W*.62,y,47.15172,5,'#c73578','discB'));}
 particles=[];trails=[];aim=null;selected=null;turn='A';settleTimer=0;updateTurn();
}
function resize(){
 const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 // Preserve the artwork's original proportions; enlarge uniformly to cover the screen.
 scale=Math.max(canvas.height/W,canvas.width/H);offsetX=(canvas.width-H*scale)/2;offsetY=(canvas.height-W*scale)/2;
}
function pos(e){const r=canvas.getBoundingClientRect();const sx=(e.clientX-r.left)*dpr,sy=(e.clientY-r.top)*dpr;return{x:(sy-offsetY)/scale,y:H-(sx-offsetX)/scale}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateTurn(){}
function moving(){return bodies.some(b=>b._returnAnim||Math.hypot(b.vx,b.vy)>(b.kind==='ball'?.08:.8))}
function playTone(freq=260,dur=.06,type='sine',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function playPostClang(impactSpeed){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const hit=new Audio('./ball.m4a');
  hit.preload='auto';
  hit.playbackRate=.86;
  const source=audio.createMediaElementSource(hit);
  const gain=audio.createGain();
  gain.gain.value=1.3*clamp(impactSpeed/650,.8,1.25);
  source.connect(gain);gain.connect(audio.destination);
  hit.play().catch(()=>{});
  setTimeout(()=>{
   if(!soundOn)return;
   const reaction=new Audio('./react.mp3');
   reaction.volume=1;
   const reactionSource=audio.createMediaElementSource(reaction);
   const reactionGain=audio.createGain();
   reactionGain.gain.value=2.2;
   reactionSource.connect(reactionGain);
   reactionGain.connect(audio.destination);
   reaction.play().catch(()=>{});
  },200);
 }catch{}
}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*20,color,r:1+Math.random()*3})}}
function showToast(){}
function strike(b,dx,dy,aimPctOverride=null){const len=Math.hypot(dx,dy);if(len<2.5)return;const aimPct=aimPctOverride===null?clamp((len-50)/100,0,1):clamp(aimPctOverride,0,1);const aimPower=b.kind==='ball'?Math.pow(aimPct,1.8):aimPct;const power=1100*aimPower*(b.kind==='ball'?.65:1)*1.10*1.5;b.vx=dx/len*power;b.vy=dy/len*power;b.spin=0;b.visualRoll=0;const restingBall=bodies.find(body=>body.kind==='ball');if(restingBall)restingBall.visualRoll=0;b.lowAimDrag=b.kind==='ball'?0:10*Math.pow(1-aimPct,2)*(aimPct<0.5?0.7:aimPct>0.5?1.3:1);b.frictionActive=false;b.ballCollisionCount=0;b.lastBallCollisionTick=-1;if(b.kind!=='ball'){const ball=bodies.find(body=>body.kind==='ball');if(ball){ball.frictionActive=false;ball.ballCollisionCount=0;ball._contactsLastTick=new Set();ball._contactsThisTick=new Set();}}turn=turn==='A'?'B':'A';shots++;updateTurn();playTone(180,.09,'triangle',.05);burst(b.x,b.y,b.color,7)}
const teamA=[0,3,5,7,9],teamB=[1,4,6,8,10];
// Clean aiming controller: one finger keeps the original pull-back gesture;
// with two fingers, movement from BOTH fingers contributes to the same aim vector.
// Two-control aiming: finger 1 sets pull strength; finger 2 sets shot direction.
const activePointers=new Set();
const touchPositions=new Map();
const pointerPositions=new Map();
let powerPointerId=null,directionPointerId=null;
let powerStart=null,powerLength=0,powerBase=0,powerRadialStart=0,powerRadialBase=0,directionUnit=null,directionTarget=null,twoFingerMode=false;
let dualPowerVector=null;
let pinchStartDistance=0,pinchStartAngle=0,pinchBasePower=0,pinchBaseDirection=0;
let gestureVector=null,gestureCancelled=false,maxGestureLength=0,oneFingerAimPct=0;
function screenPoint(clientX,clientY){
 const r=canvas.getBoundingClientRect();
 const sx=(clientX-r.left)*dpr,sy=(clientY-r.top)*dpr;
 return{x:(sy-offsetY)/scale,y:H-(sx-offsetX)/scale};
}
function refreshAim(){
 if(!selected||!directionUnit)return;
 const len=clamp(powerLength,0,150);
 gestureVector={x:directionUnit.x*len,y:directionUnit.y*len};
}
function resetTwoFingerBaseline(){
 if(powerPointerId===null||directionPointerId===null)return;
 const powerPoint=pointerPositions.get(powerPointerId),directionPoint=pointerPositions.get(directionPointerId);
 if(!powerPoint||!directionPoint)return;
 const dx=directionPoint.x-powerPoint.x,dy=directionPoint.y-powerPoint.y;
 pinchStartDistance=Math.hypot(dx,dy);
 pinchStartAngle=Math.atan2(dy,dx);
 pinchBasePower=powerLength;
 pinchBaseDirection=Math.atan2(directionUnit.y,directionUnit.x);
}
function beginAim(p,id){
 if(screenState==='teamSelect'){
  if(p.y>220&&p.y<505){
   const cardXs=[205,485,765,1045];
   for(let i=0;i<cardXs.length;i++){
    if(p.x>=cardXs[i]&&p.x<=cardXs[i]+235){chosenTeam=i;return;}
   }
  }
  if(chosenTeam>=0&&p.x>=570&&p.x<=960&&p.y>=555&&p.y<=635){
   opponentTeam=Math.floor(Math.random()*teamChoices.length);screenState='game';setup();return;
  }
  return;
 }

 if(activePointers.has(id)||activePointers.size>=2)return;
 if(activePointers.size===0){
  if(selected||moving()||turn!=='A')return;
  const hit=teamA.map(i=>bodies[i]).filter(b=>Math.hypot(p.x-b.x,p.y-b.y)<(b.r+18)*3)
   .sort((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y))[0];
  if(!hit)return;
  selected=hit;powerPointerId=id;
  // Preserve the original one-finger pull-back vector until a second finger is added.
  gestureVector={x:0,y:0};
  maxGestureLength=0;oneFingerAimPct=0;
  twoFingerMode=false;powerStart=p;powerBase=0;powerLength=0;powerRadialStart=0;powerRadialBase=0;directionUnit=null;directionTarget=null;
  gestureCancelled=false;aim={x:p.x,y:p.y};
 }else if(activePointers.size===1&&selected){
  // Reassign whichever control finger was lifted while the other one remains down.
  twoFingerMode=true;
  if(powerPointerId===null&&directionPointerId!==null){
   // A new finger takes over power, starting from the current aim magnitude.
   powerPointerId=id;
   dualPowerVector={x:gestureVector.x,y:gestureVector.y};
   powerLength=Math.hypot(dualPowerVector.x,dualPowerVector.y);
   powerRadialStart=Math.hypot(p.x-selected.x,p.y-selected.y);powerRadialBase=powerLength;
   powerStart=p;
  }else if(directionPointerId===null&&powerPointerId!==null){
   // Preserve the existing pull-back magnitude when finger 2 joins.
   dualPowerVector={x:gestureVector.x,y:gestureVector.y};
   powerLength=Math.hypot(dualPowerVector.x,dualPowerVector.y);
   const powerPoint=pointerPositions.get(powerPointerId);
   powerRadialStart=powerPoint?Math.hypot(powerPoint.x-selected.x,powerPoint.y-selected.y):0;
   powerRadialBase=powerLength;
   directionPointerId=id;
   // On the first join, finger 2 chooses direction. On rejoin, keep the previous direction.
   if(!directionUnit){
    const dx=p.x-selected.x,dy=p.y-selected.y,len=Math.hypot(dx,dy);
    if(len>3){directionTarget={x:dx,y:dy};directionUnit={x:dx/len,y:dy/len};}
    else{
     const currentLen=Math.hypot(gestureVector.x,gestureVector.y)||1;
     directionUnit={x:gestureVector.x/currentLen,y:gestureVector.y/currentLen};
     directionTarget={x:directionUnit.x*100,y:directionUnit.y*100};
    }
   }else if(!directionTarget){directionTarget={x:directionUnit.x*100,y:directionUnit.y*100};}
   refreshAim();
  }
 }
 activePointers.add(id);pointerPositions.set(id,p);
 if(twoFingerMode)resetTwoFingerBaseline();
}
function moveAim(id,p){
 if(!selected||!activePointers.has(id))return;
 if(!twoFingerMode){
  if(id===powerPointerId){
   // Original one-finger aiming: preserve the pull vector and apply pointer movement deltas.
   const previous=pointerPositions.get(id);
   if(previous){gestureVector.x-=(p.x-previous.x);gestureVector.y-=(p.y-previous.y);}
   const currentLength=Math.hypot(gestureVector.x,gestureVector.y);
   maxGestureLength=Math.max(maxGestureLength,currentLength);
   const peakPower=clamp((maxGestureLength-50)/100,0,1);
   const returnDistance=Math.max(0,maxGestureLength-currentLength);
   oneFingerAimPct=clamp(peakPower-returnDistance/100,0,1);
   aim={x:p.x,y:p.y};
  }
 }else if(id===powerPointerId||id===directionPointerId){
  // Original two-finger pinch: spacing controls power and line rotation controls direction.
  pointerPositions.set(id,p);
  const powerPoint=pointerPositions.get(powerPointerId),directionPoint=pointerPositions.get(directionPointerId);
  if(powerPoint&&directionPoint){
   const dx=directionPoint.x-powerPoint.x,dy=directionPoint.y-powerPoint.y;
   const distance=Math.hypot(dx,dy),angle=Math.atan2(dy,dx);
   powerLength=clamp(pinchBasePower+(distance-pinchStartDistance),0,150);
   const angleDelta=Math.atan2(Math.sin(angle-pinchStartAngle),Math.cos(angle-pinchStartAngle));
   const shotAngle=pinchBaseDirection+angleDelta;
   directionUnit={x:Math.cos(shotAngle),y:Math.sin(shotAngle)};
   refreshAim();
  }
  aim={x:p.x,y:p.y};
  return;
 }
 pointerPositions.set(id,p);
}
function finishAim(id,cancelled=false){
 if(!activePointers.has(id))return;
 if(cancelled)gestureCancelled=true;
 activePointers.delete(id);pointerPositions.delete(id);
 if(id===powerPointerId)powerPointerId=null;
 if(id===directionPointerId)directionPointerId=null;
 if(activePointers.size===1&&selected){
  // Fall back to one-finger aiming without ending the current shot.
  const remainingId=activePointers.values().next().value;
  const remainingPoint=pointerPositions.get(remainingId);
  powerPointerId=remainingId;directionPointerId=null;twoFingerMode=false;
  if(remainingPoint)aim={x:remainingPoint.x,y:remainingPoint.y};
  maxGestureLength=Math.hypot(gestureVector?.x||0,gestureVector?.y||0);oneFingerAimPct=clamp((maxGestureLength-50)/100,0,1);
 }else if(activePointers.size===0){
  if(!gestureCancelled&&selected&&gestureVector){const finalLength=Math.hypot(gestureVector.x,gestureVector.y);const finalAimPct=twoFingerMode?clamp((finalLength-50)/100,0,1):oneFingerAimPct;if(finalAimPct>0)strike(selected,gestureVector.x,gestureVector.y,finalAimPct);}
  selected=null;aim=null;powerPointerId=null;directionPointerId=null;
  powerStart=null;powerLength=0;powerBase=0;powerRadialStart=0;powerRadialBase=0;directionUnit=null;directionTarget=null;twoFingerMode=false;dualPowerVector=null;
  gestureVector=null;gestureCancelled=false;maxGestureLength=0;oneFingerAimPct=0;pointerPositions.clear();touchPositions.clear();
 }
}
canvas.addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  const id='t'+t.identifier;if(activePointers.size>=2)continue;
  beginAim(screenPoint(t.clientX,t.clientY),id);
  if(activePointers.has(id))touchPositions.set(t.identifier,id);
 }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id)moveAim(id,screenPoint(t.clientX,t.clientY));}
},{passive:false});
canvas.addEventListener('touchend',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id){finishAim(id,false);touchPositions.delete(t.identifier);}}
},{passive:false});
canvas.addEventListener('touchcancel',e=>{
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id){finishAim(id,true);touchPositions.delete(t.identifier);}}
},{passive:false});
// Mouse/pen fallback; touch input is handled only by native touch events.
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')return;
 beginAim(pos(e),e.pointerId);
 if(activePointers.has(e.pointerId)){try{canvas.setPointerCapture(e.pointerId)}catch{}}
});
window.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')moveAim(e.pointerId,pos(e));},{capture:true});
window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')finishAim(e.pointerId,false);},{capture:true});
window.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')finishAim(e.pointerId,true);},{capture:true});
let physicsTick=0;
function physics(h){
  physicsTick++;
  // Pause gameplay while every returned disc completes its own animation.
  const returning=bodies.filter(b=>b._returnAnim);
  if(returning.length){
   for(const body of returning){
    const anim=body._returnAnim;anim.elapsed+=h;
    const t=Math.min(anim.elapsed/anim.duration,1),ease=t*t*(3-2*t);
    body.x=anim.fromX+(anim.toX-anim.fromX)*ease;
    body.y=anim.fromY+(anim.toY-anim.fromY)*ease;
    if(t>=1)delete body._returnAnim;
   }
   return;
  }
  for(const b of bodies)if(b.kind==='ball')b._contactsThisTick=new Set();
 // h is a fixed 1/120-second step. Velocities are pixels per second.
 for(const b of bodies){
  const speed=Math.hypot(b.vx,b.vy);
  if(speed>0&&b.kind!=='ball'&&!b.frictionActive&&b.lowAimDrag>0){
    // Gentle shots lose speed from the start, so they also travel a much shorter distance.
    const factor=Math.exp(-b.lowAimDrag*h);
    b.vx*=factor;b.vy*=factor;
   }
  if(speed>0&&b.kind==='ball'){
     // Smooth rolling drag: proportional to speed, so the ball eases naturally
     // instead of losing a fixed amount of speed near the end of its roll.
     const rollingDamping=1.8; // per-second rolling resistance
     const factor=Math.exp(-rollingDamping*h);
     b.vx*=factor;b.vy*=factor;
    }else if(speed>0&&b.frictionActive){
    // Player discs retain their existing post-impact rolling resistance.
    const factor=Math.exp(-2.5*h);
    b.vx*=factor;b.vy*=factor;
   }
  // A small Magnus-like curve is driven by spin, not an arbitrary per-frame boost.
  if(b.kind==='ball'){
   const curve=clamp(b.spin*.00075,-.22,.22),vx=b.vx,vy=b.vy;
   b.vx+=-vy*curve*h;b.vy+=vx*curve*h;
  }
  b.x+=b.vx*h;b.y+=b.vy*h;
  if(b.kind==='ball'){
   // Match the reference: natural rolling rotation while moving, with no spin after stopping.
   const rollingRate=Math.hypot(b.vx,b.vy)/b.r;
   if(rollingRate>.08)b.angle+=(rollingRate+b.spin)*h*1.18;
   else{b.visualRoll=0;b.spin=0;}
  }else{
   b.angle+=(Math.hypot(b.vx,b.vy)/b.r+b.spin)*h;
  }
  b.spin*=Math.exp(-(b.kind==='ball'?1.7:2.8)*h);
  if(Math.hypot(b.vx,b.vy)<(b.kind==='ball'?.08:1.2)){b.vx=0;b.vy=0;b.spin=0}
  // Player-piece contacts use the exact green dotted ring: radius r*0.73416-8, centered 6px below the artwork center.
  const hitRadius=b.kind==='ball'?b.r:Math.max(0,b.r*.73416-8);
  const contactOffset=b.kind==='ball'?0:6;
  const contactY=b.y+contactOffset;
  // The upper opening edge follows the visible upper-post collision circles.
  const goalOpeningTop=FIELD.goalTop+19;
  const inGoalMouth=contactY>goalOpeningTop&&contactY<FIELD.goalBottom;
  // The white goal line is open for every body; the net's far end is the new wall.
  const beyondLeftGoal=b.x<FIELD.left&&inGoalMouth;
  const beyondRightGoal=b.x>FIELD.right&&inGoalMouth;
  // Open the side-wall collision as soon as the disc's leading edge reaches the goal mouth.
  // Checking only the center here caused the disc to rebound before it could cross the line.
  const enteringLeftGoal=inGoalMouth&&b.x-hitRadius<FIELD.left;
  const enteringRightGoal=inGoalMouth&&b.x+hitRadius>FIELD.right;

  if(b.x-hitRadius<FIELD.left&&!enteringLeftGoal){b.x=FIELD.left+hitRadius;resolveStaticContact(b,1,0,b.kind==='ball'?.92:.84,'wall-left');wallFX(b.x,b.y)}
  if(b.x+hitRadius>FIELD.right&&!enteringRightGoal){b.x=FIELD.right-hitRadius;resolveStaticContact(b,-1,0,b.kind==='ball'?.92:.84,'wall-right');wallFX(b.x,b.y)}
  // Back walls at the end of each net tunnel, with the same rebound response as field walls.
  if(beyondLeftGoal&&b.x-hitRadius<FIELD.left-goalDepth){b.x=FIELD.left-goalDepth+hitRadius;resolveStaticContact(b,1,0,b.kind==='ball'?.92:.84,'net-back-left');wallFX(b.x,b.y)}
  if(beyondRightGoal&&b.x+hitRadius>FIELD.right+goalDepth){b.x=FIELD.right+goalDepth-hitRadius;resolveStaticContact(b,-1,0,b.kind==='ball'?.92:.84,'net-back-right');wallFX(b.x,b.y)}
  // The upper and lower edges of the net tunnel also behave like walls.
  if(beyondLeftGoal||beyondRightGoal){
   if(contactY-hitRadius<goalOpeningTop){b.y=goalOpeningTop+hitRadius-contactOffset;resolveStaticContact(b,0,1,b.kind==='ball'?.92:.84,'net-side-top');wallFX(b.x,b.y)}
   if(contactY+hitRadius>FIELD.goalBottom){b.y=FIELD.goalBottom-hitRadius-contactOffset;resolveStaticContact(b,0,-1,b.kind==='ball'?.92:.84,'net-side-bottom');wallFX(b.x,b.y)}
  }
  if(contactY-hitRadius<FIELD.top){b.y=FIELD.top+hitRadius-contactOffset;resolveStaticContact(b,0,1,b.kind==='ball'?.92:.84,'wall-top');wallFX(b.x,b.y)}

 }

  if(isOpponentPiece&&chosenTeam>=0&&opponentTeam===chosenTeam){
   ctx.beginPath();ctx.arc(0,0,b.r*0.72,0,Math.PI*2);ctx.clip();
   ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-b.r*0.72,-b.r*0.72,b.r*1.44,b.r*1.44);
  }
  ctx.restore();
  if(pieceTop.complete&&pieceTop.naturalWidth){
   ctx.save();ctx.translate(b.x,b.y);
   ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.clip();
   ctx.drawImage(pieceTop,-b.r,-b.r,b.r*2,b.r*2);
   ctx.restore();
  }
  ctx.restore();
 }


// Restore the dotted aiming direction guide; collision/debug guides stay hidden.
if(selected&&gestureVector){
 const b=selected,len=Math.hypot(gestureVector.x,gestureVector.y);
 const nx=len>0?gestureVector.x/len:0,ny=len>0?gestureVector.y/len:0;
 const power=Math.min(len,150);
 const haloPower=twoFingerMode?clamp((power-50)/100,0,1):oneFingerAimPct;
 const haloDiameter=2*(b.r+8+58*haloPower);
 if(haloPower>0){
  ctx.save();ctx.strokeStyle='#69cdff';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.globalAlpha=.95;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+nx*haloDiameter,b.y+ny*haloDiameter);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();ctx.globalAlpha=1;
 }
}
drawGoalOverlay(goalLeftTexture,goalLeftBounds,FIELD.left-goalDepth,FIELD.goalTop,goalDepth,FIELD.goalBottom-FIELD.goalTop);
 drawGoalOverlay(goalRightTexture,goalRightBounds,FIELD.right,FIELD.goalTop,goalDepth,FIELD.goalBottom-FIELD.goalTop);
 ctx.restore();
 particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96}
 trails=trails.filter(t=>t.life-->0);
}
// 360 Hz physics steps keep even fast ball/post contacts from skipping over thin collision shapes.
let last=0,accumulator=0,aiWait=0;const FIXED_STEP=1/360;
function frame(t){if(!last)last=t;const elapsed=Math.min((t-last)/1000,.05);last=t;accumulator+=elapsed;while(accumulator>=FIXED_STEP){if(moving())physics(FIXED_STEP);accumulator-=FIXED_STEP}if(!moving()&&turn==='B'){aiWait+=elapsed*60;if(aiWait>30){aiWait=0;ai()}}else if(turn!=='B')aiWait=0;draw();requestAnimationFrame(frame)}
new ResizeObserver(resize).observe(canvas);resize();setup();requestAnimationFrame(frame);
})();
</script>
