<!doctype html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061523;touch-action:none}
#app,.arena-wrap{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;max-width:none;border:0;border-radius:0;box-shadow:none;touch-action:none}

#formationButton{position:fixed;left:14px;bottom:14px;z-index:10;width:44px;height:44px;padding:0;display:grid;place-items:center;background:#fff;border:1px solid rgba(10,25,40,.2);border-radius:7px;box-shadow:0 2px 9px rgba(0,0,0,.28);color:#102638;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#formationButton svg{width:25px;height:25px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#formationPanel{position:fixed;left:50%;top:50%;z-index:20;width:min(560px,calc(100dvh - 24px));max-height:calc(100vw - 24px);overflow:auto;padding:10px;background:rgba(7,20,31,.97);border:1px solid rgba(105,220,220,.55);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.48);color:#eafaff;touch-action:pan-y;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}
#formationPanel[hidden]{display:none}
.formationPanelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font:800 12px system-ui;letter-spacing:1px;color:#8ef4e8}
#formationClose{width:26px;height:26px;border:0;border-radius:5px;background:#203849;color:#fff;font-size:21px;line-height:1;flex:0 0 auto}
.formationGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.formationOption{min-width:0;padding:5px;background:#122a3a;border:1px solid #38596b;border-radius:6px;color:#eafaff;text-align:center;display:flex;flex-direction:column;gap:3px;font:700 9px system-ui}
.formationOption svg{width:100%;height:38px;display:block}
.formationOption.active{border-color:#62f4df;background:#16434a;box-shadow:inset 0 0 0 1px #62f4df}
</style>

  <button class="formationOption" type="button" data-formation="7"><span>08 · COUNTER</span><svg viewBox="0 0 92 52" aria-hidden="true"><rect x="1" y="1" width="90" height="50" rx="3" fill="#123c31" stroke="#d5e8d8" stroke-width="1"/><path d="M46 1v50M46 17a9 9 0 1 0 0 18a9 9 0 1 0 0-18M1 14h9v24H1M91 14h-9v24h9" fill="none" stroke="#d5e8d8" stroke-width=".7" opacity=".75"/><g fill="#57e5d5" stroke="#eaffff" stroke-width=".7"><circle cx="9" cy="26" r="3.1"/><circle cx="23" cy="15" r="3.1"/><circle cx="23" cy="37" r="3.1"/><circle cx="38" cy="15" r="3.1"/><circle cx="38" cy="37" r="3.1"/></g></svg></button>
  <button class="formationOption" type="button" data-formation="8"><span>09 · BOX</span><svg viewBox="0 0 92 52" aria-hidden="true"><rect x="1" y="1" width="90" height="50" rx="3" fill="#123c31" stroke="#d5e8d8" stroke-width="1"/><path d="M46 1v50M46 17a9 9 0 1 0 0 18a9 9 0 1 0 0-18M1 14h9v24H1M91 14h-9v24h9" fill="none" stroke="#d5e8d8" stroke-width=".7" opacity=".75"/><g fill="#57e5d5" stroke="#eaffff" stroke-width=".7"><circle cx="9" cy="26" r="3.1"/><circle cx="27" cy="15" r="3.1"/><circle cx="27" cy="37" r="3.1"/><circle cx="42" cy="15" r="3.1"/><circle cx="42" cy="37" r="3.1"/></g></svg></button>

 </div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=1529,H=688,wall=24,goalW=170,goalDepth=78;
// Keep the complete supplied arena image, including the player-name and score panels.
const FIELD={left:330,right:1240,top:113,bottom:677,goalTop:272,goalBottom:490};
const GOAL_UPPER_WALL_Y=FIELD.goalTop+20;
let dpr=1,scale=1,offsetX=0,offsetY=0,scoreA=0,scoreB=0,turn='A',aim=null,selected=null,shots=0,particles=[],trails=[],soundOn=true,audio=null,toastTimer=0,settleTimer=0,goalEvents=0;
let pendingPostReaction=false;
// Only the very first shot after each centre restart is subject to the no-goal rule.
let firstKickoffShotPending=true,firstKickoffShotInProgress=false,firstKickoffShotShooter='A';
let pendingKickoffReset=null;
// Preload crowd reactions as audio elements and fetch their bytes for instant WebAudio playback.
const postReactionUrls=['./react.mp3','./react2.mp3','./react3.mp3'];
const postReactionSounds=postReactionUrls.map(src=>{
 const sound=new Audio(src);sound.preload='auto';sound.load();return sound;
});
const postReactionDataPromise=Promise.all(postReactionUrls.map(async src=>{
 const response=await fetch(src);if(!response.ok)throw new Error('Reaction audio failed to load');return response.arrayBuffer();
})).catch(()=>null);
let postReactionBuffers=null,postReactionDecodePromise=null;
function preparePostReactionBuffers(){
 if(!audio||postReactionDecodePromise)return;
 postReactionDecodePromise=postReactionDataPromise.then(data=>{
  if(!data)return;
  return Promise.all(data.map(buffer=>audio.decodeAudioData(buffer.slice(0)))).then(buffers=>{postReactionBuffers=buffers;});
 }).catch(()=>{});
}
const bodies=[];

let ballShotTrailUntil=0,ballShotTrailSamples=[];
let screenState='teamSelect',chosenTeam=-1,opponentTeam=-1;
const teamChoices=[
 {name:'ESTEGHLAL',file:'teams/esteghlal-new.png',image:new Image()},
 {name:'PERSEPOLIS',file:'teams/Perspolis-new.png',image:new Image()},
 {name:'SEPAHAN',file:'teams/sepahan-new.png',image:new Image()},
 {name:'TRACTOR',file:'teams/teraktor-new.png',image:new Image()}
];
teamChoices.forEach(t=>{t.image.src=t.file});

const pieceSide=new Image(),pieceTop=new Image();
pieceSide.src='piece-logo-new.png';
pieceTop.src='piece-top-new.png';
const ballTexture=new Image();ballTexture.src='ball_exact.jpg';
// Dedicated goal celebration sound stored in the repository.
const goalSound=new Audio('./goal.mp3');goalSound.preload='auto';
// Keep the original high-resolution arena artwork for maximum visual fidelity.
const fieldTexture=new Image();fieldTexture.src='1794090316714.jpg';
// Decorative goal-net overlays; crop transparent padding so the complete goal artwork is visible.
function goalAlphaBounds(img){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
 const px=g.getImageData(0,0,c.width,c.height).data;
 let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
  if(px[(y*c.width+x)*4+3]>8){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
 }
 return maxX>=minX?{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}:{x:0,y:0,w:c.width,h:c.height};
}
function drawGoalOverlay(img,bounds,x,y,w,h){
 if(!img.complete||!img.naturalWidth)return;
 const b=bounds||{x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
 ctx.drawImage(img,b.x,b.y,b.w,b.h,x,y,w,h);
}
const goalLeftTexture=new Image(),goalRightTexture=new Image();
let goalLeftBounds=null,goalRightBounds=null;
goalLeftTexture.onload=()=>{goalLeftBounds=goalAlphaBounds(goalLeftTexture)};
goalRightTexture.onload=()=>{goalRightBounds=goalAlphaBounds(goalRightTexture)};
goalLeftTexture.src='goal-left.png';goalRightTexture.src='goal-right.png';

const make=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,inv:1/mass,spin:0,angle:0,frictionActive:false});
function setup(startingTurn='A'){
 bodies.length=0;
 bodies.push(make(W*.24,H/2,47.15172,5,'#53f5e8','strikerA'));
 bodies.push(make(W*.76,H/2,47.15172,5,'#ff4f9a','strikerB'));
 bodies.push(make((FIELD.left+FIELD.right)/2,(FIELD.top+FIELD.bottom)/2,13.2,.82,'#f5fbff','ball')); // Return the ball to the centre for every kickoff.
 for(let i=0;i<4;i++){const y=H/2+(i-1.5)*76;bodies.push(make(W*.38,y,47.15172,5,'#1fb9c9','discA'));bodies.push(make(W*.62,y,47.15172,5,'#c73578','discB'));}
 particles=[];trails=[];aim=null;selected=null;turn=startingTurn;settleTimer=0;firstKickoffShotPending=true;firstKickoffShotInProgress=false;firstKickoffShotShooter=startingTurn;applyFormation(selectedFormation,teamA,false);applyFormation(aiFormation,teamB,true);updateTurn();
}
function resize(){
 const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 // Preserve the artwork's original proportions; enlarge uniformly to cover the screen.
 scale=Math.max(canvas.height/W,canvas.width/H);offsetX=(canvas.width-H*scale)/2;offsetY=(canvas.height-W*scale)/2;
}
function pos(e){const r=canvas.getBoundingClientRect();const sx=(e.clientX-r.left)*dpr,sy=(e.clientY-r.top)*dpr;return{x:(sy-offsetY)/scale,y:H-(sx-offsetX)/scale}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateTurn(){}
const BALL_REST_SPEED=1.2; // End visually imperceptible ball drift sooner without changing rolling friction.
function moving(){return !!pendingKickoffReset||bodies.some(b=>b._returnAnim||Math.hypot(b.vx,b.vy)>(b.kind==='ball'?BALL_REST_SPEED:.8))}
function playTone(freq=260,dur=.06,type='sine',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();preparePostReactionBuffers();if(audio.state==='suspended')audio.resume().catch(()=>{});let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
// Short, consistent UI click used only by team and formation controls.
function playClickSound(){playTone(680,.035,'square',.018)}
function ballTrajectoryEntersGoal(ball){
 const minY=FIELD.goalTop+ball.r*.8;
 const maxY=FIELD.goalBottom-ball.r*.8;
 let timeToLine;
 if(ball.vx>0){
  timeToLine=(FIELD.right+ball.r*.8-ball.x)/ball.vx;
 }else if(ball.vx<0){
  timeToLine=(FIELD.left-ball.r*.8-ball.x)/ball.vx;
 }else return false;
 if(timeToLine<=0)return false;
 const projectedY=ball.y+ball.vy*timeToLine;
 return projectedY>=minY&&projectedY<=maxY;
}
function playPostClang(impactSpeed){
 if(!soundOn)return;
 pendingPostReaction=true;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  preparePostReactionBuffers();
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  const hit=new Audio('./ball.m4a');
  hit.preload='auto';
  hit.playbackRate=.86;
  const source=audio.createMediaElementSource(hit);
  const gain=audio.createGain();
  gain.gain.value=2.6*clamp(impactSpeed/650,.8,1.25);
  source.connect(gain);gain.connect(audio.destination);
  hit.play().catch(()=>{});
 }catch{}
}
function playPendingPostReaction(){
 if(!pendingPostReaction)return;
 pendingPostReaction=false;
 if(!soundOn)return;
 try{
  const index=Math.floor(Math.random()*postReactionSounds.length);
  if(audio&&postReactionBuffers&&postReactionBuffers[index]){
   if(audio.state==='suspended')audio.resume().catch(()=>{});
   const source=audio.createBufferSource();source.buffer=postReactionBuffers[index];
   source.connect(audio.destination);source.start(0);
  }else{
   const reaction=postReactionSounds[index];
   reaction.pause();reaction.currentTime=0;reaction.volume=1;
   reaction.play().catch(()=>{});
  }
 }catch{}
}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*20,color,r:1+Math.random()*3})}}
function showToast(){}
function strike(b,dx,dy,aimPctOverride=null){const len=Math.hypot(dx,dy);if(len<2.5)return;if(firstKickoffShotPending){firstKickoffShotPending=false;firstKickoffShotInProgress=true;firstKickoffShotShooter=turn;}const aimPct=aimPctOverride===null?clamp((len-50)/100,0,1):clamp(aimPctOverride,0,1);const aimPower=b.kind==='ball'?Math.pow(aimPct,2.0):aimPct;const power=900*aimPower*(b.kind==='ball'?.65:1)*1.10*1.5;b.vx=dx/len*power;b.vy=dy/len*power;b.spin=0;b.visualRoll=0;if(b.kind==='ball'){ballShotTrailUntil=performance.now()+380;ballShotTrailSamples=[];}const restingBall=bodies.find(body=>body.kind==='ball');if(restingBall)restingBall.visualRoll=0;b.lowAimDrag=b.kind==='ball'?0:10*Math.pow(1-aimPct,2)*(aimPct<0.5?0.7:aimPct>0.5?1.3:1);b.frictionActive=false;b.ballCollisionCount=0;b.lastBallCollisionTick=-1;if(b.kind!=='ball'){const ball=bodies.find(body=>body.kind==='ball');if(ball){ball.frictionActive=false;ball.ballCollisionCount=0;ball._contactsLastTick=new Set();ball._contactsThisTick=new Set();}}turn=aiActing?'A':'B';shots++;updateTurn();playTone(180,.09,'triangle',.05);burst(b.x,b.y,b.color,7)}
const teamA=[0,3,5,7,9],teamB=[1,4,6,8,10];
const formations=[
 [[.08,.50],[.38,.18],[.38,.82],[.76,.32],[.76,.68]],
 [[.10,.50],[.34,.22],[.34,.78],[.68,.22],[.68,.78]],

 const haloPower=twoFingerMode?clamp((power-50)/100,0,1):oneFingerAimPct;
 const haloDiameter=2*(b.r+8+58*haloPower);
 if(haloPower>0){
  ctx.save();ctx.strokeStyle='#69cdff';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.globalAlpha=.95;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+nx*haloDiameter,b.y+ny*haloDiameter);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();ctx.globalAlpha=1;
 }
}
function drawImpactRanges(){
 // Orange dashed guides show the exact collision reach used by the physics solver.
 ctx.save();
 ctx.strokeStyle='#ff982b';ctx.lineWidth=2.2;ctx.globalAlpha=.96;
 ctx.setLineDash([8,7]);
 // Effective circular contact radius for every movable element.
 for(const b of bodies){
  if(b._returnAnim){} // Keep guides attached to the element during its return animation.
  const hitRadius=b.kind==='ball'?b.r:Math.max(0,b.r*.73416-8);
  const contactOffset=b.kind==='ball'?0:6;
  ctx.beginPath();ctx.arc(b.x,b.y+contactOffset,hitRadius,0,Math.PI*2);ctx.stroke();
 }
 // Main pitch walls, with the goal openings left clear.
 ctx.beginPath();
 ctx.moveTo(FIELD.left,FIELD.top);ctx.lineTo(FIELD.right,FIELD.top);
 ctx.moveTo(FIELD.left,FIELD.bottom);ctx.lineTo(FIELD.right,FIELD.bottom);
 ctx.moveTo(FIELD.left,FIELD.top);ctx.lineTo(FIELD.left,GOAL_UPPER_WALL_Y);
 ctx.moveTo(FIELD.left,FIELD.goalBottom);ctx.lineTo(FIELD.left,FIELD.bottom);
 ctx.moveTo(FIELD.right,FIELD.top);ctx.lineTo(FIELD.right,GOAL_UPPER_WALL_Y);
 ctx.moveTo(FIELD.right,FIELD.goalBottom);ctx.lineTo(FIELD.right,FIELD.bottom);
 // Goal interior: upper/lower side walls and the back wall on both sides.
 ctx.moveTo(FIELD.left-goalDepth,GOAL_UPPER_WALL_Y);ctx.lineTo(FIELD.left,GOAL_UPPER_WALL_Y);
 ctx.moveTo(FIELD.left-goalDepth,FIELD.goalBottom);ctx.lineTo(FIELD.left,FIELD.goalBottom);
 ctx.moveTo(FIELD.left-goalDepth,GOAL_UPPER_WALL_Y);ctx.lineTo(FIELD.left-goalDepth,FIELD.goalBottom);
 ctx.moveTo(FIELD.right,GOAL_UPPER_WALL_Y);ctx.lineTo(FIELD.right+goalDepth,GOAL_UPPER_WALL_Y);
 ctx.moveTo(FIELD.right,FIELD.goalBottom);ctx.lineTo(FIELD.right+goalDepth,FIELD.goalBottom);
 ctx.moveTo(FIELD.right+goalDepth,GOAL_UPPER_WALL_Y);ctx.lineTo(FIELD.right+goalDepth,FIELD.goalBottom);
 ctx.stroke();
 ctx.setLineDash([]);ctx.restore();
}

drawImpactRanges();
 drawGoalOverlay(goalLeftTexture,goalLeftBounds,FIELD.left-goalDepth,FIELD.goalTop,goalDepth,FIELD.goalBottom-FIELD.goalTop);
 drawGoalOverlay(goalRightTexture,goalRightBounds,FIELD.right,FIELD.goalTop,goalDepth,FIELD.goalBottom-FIELD.goalTop);
 ctx.restore();
 particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96}
 trails=trails.filter(t=>t.life-->0);
}
// 360 Hz physics steps keep even fast ball/post contacts from skipping over thin collision shapes.
let last=0,accumulator=0,aiWait=0,aiActing=false;const FIXED_STEP=1/360;
function frame(t){if(!last)last=t;const elapsed=Math.min((t-last)/1000,.05);last=t;accumulator+=elapsed;while(accumulator>=FIXED_STEP){if(moving())physics(FIXED_STEP);accumulator-=FIXED_STEP}if(screenState==='game'&&turn==='B'&&!moving()&&!aim){aiWait+=elapsed;if(aiWait>=.65){aiWait=0;ai();}}else aiWait=0;draw();requestAnimationFrame(frame)}
const formationButton=$('formationButton'),formationPanel=$('formationPanel');
formationButton.addEventListener('click',()=>{if(screenState!=='game')return;playClickSound();formationPanelOpen=!formationPanelOpen;formationPanel.hidden=!formationPanelOpen;});
$('formationClose').addEventListener('click',()=>{formationPanelOpen=false;formationPanel.hidden=true;});
formationPanel.addEventListener('click',e=>{const option=e.target.closest('.formationOption');if(!option)return;playClickSound();pendingFormation=Number(option.dataset.formation);formationPanel.querySelectorAll('.formationOption').forEach((el,i)=>el.classList.toggle('active',i===(pendingFormation===null?selectedFormation:pendingFormation)));formationPanelOpen=false;formationPanel.hidden=true;});
new ResizeObserver(resize).observe(canvas);resize();setup();requestAnimationFrame(frame);
})();
</script>
